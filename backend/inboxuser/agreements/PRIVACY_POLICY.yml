name: Privacy Policy Acknowledgement
updated: 2023/03/11
description: How Mailboxsweep uses your data and protects your privacy
body: >
  MAILBOXSWEEP PRIVACY POLICY


  This agreement defines how Mailboxsweep, LLC (MailboxSweep, "the company") will use the information
  you provide in the course of providing you service, as well as what information we collect, and your
  rights.

  DATA COLLECTED BY MAILBOXSWEEP

  Mailboxsweep will collect basic contact information from you (your full name and email address) as well
  as basic information required to collect payment for our service through our payment processing partner,
  such as your address and phone number. You may provide this information to us directly, or we may get
  it when you interact with our partners in the process of using our service (such as if you sign in
  using your Google account or complete payment through Stripe.)

  MailboxSweep may request sensitive information needed to access your email inbox to provide our service.
  This information is provided at your sole discretion.

  MailboxSweep may, during the course of providing service, collect information from your connected
  email inbox, such as email senders, subjects, and keywords. This information is only collected for
  the purposes of organizing your inbox and is stored securely. MailboxSweep does not share or sell
  ANY information provided directly by you or used during organizing your inbox with any external
  parties, to the extent afforded by applicable law.

  DATA RETENTION

  The basic profile information used to create your account is maintained as long as you have an account
  with MailboxSweep. You may request to have this profile information deleted by emailing support
  (support@mailboxsweep.com) and we will comply with your request within 45 days.

  Data gathered during the process of organizing your inbox, including information you provide to allow
  us to access your inbox, will be kept for at most 35 days, after which it will be permanently deleted.

  Sensitive information, such as information about the contents of your mailbox, used to provide the
  offered service, and information used to access your inbox securely, are encrypted with enterprise-
  grade encryption.

  DATA USAGE

  We use the profile information you provide, as well as any information submitted when you complete payment,
  to associate your payment with your account.

  We use the inbox credentials you provide to access your email for the sole purpose of helping you
  organize and clean up your inbox. Your inbox will never be accessed without your explicit consent.

  COOKIES

  MailboxSweep uses cookies to support necessary app functionality and improve your experience using the product.
  We do not use cookies to track you across other websites, and we do not use third party cookies.
