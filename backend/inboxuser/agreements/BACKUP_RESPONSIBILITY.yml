name: Backup Responsibility Agreement
updated: 2022/12/19
description: Steps we will both take to ensure your data is safe
body: >
    Mailboxsweep is a powerful tool that can update and delete large numbers of messages. As a
    user of the Mailboxsweep service, the mailbox owner ("you") are responsible for creating
    a comprehensive backup of your email inbox. In the event that use of the Mailboxsweep tool
    results in unwanted changes or deletions from your inbox, your backup will ensure no loss
    of data. Mailboxsweep, LLC is not responsible for loss of data due to use of the Mailboxsweep
    tool. By agreeing to this notice, you certify that you will create a full backup of your
    email inbox before using the Mailboxsweep tool.
