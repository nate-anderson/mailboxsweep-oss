--- # ZAP automation configuration file, for more details see https://www.zaproxy.org/docs/automate/automation-framework/
env: # The environment, mandatory
  contexts: # List of 1 or more contexts, mandatory
    - name: MailboxSweep # Name to be used to refer to this context in other jobs, mandatory
      # A mandatory list of top level urls, everything under each url will be included
      urls:
        - http://localhost:8080
        - http://localhost:3000
      includePaths: # An optional list of regexes to include
      excludePaths: # An optional list of regexes to exclude
      authentication:
        method: script # String, one of 'manual', 'http', 'form', 'json' or 'script'
        parameters: # May include any required for scripts. All of the parameters support vars except for the port
          # hostname: # String, only for 'http' authentication
          # port: # Int, only for 'http' authentication
          # realm: # String, only for 'http' authentication
          # loginPageUrl: # String, the login page URL to read prior to making the request, only for 'form' or 'json' authentication
          # loginRequestUrl: # String, the login URL to request, only for 'form' or 'json' authentication
          # loginRequestBody: # String, the login request body - if not supplied a GET request will be used, only for 'form' or 'json' authentication
          script: auth.js # String, path to script, only for 'script' authentication
          scriptEngine: "ECMAScript : Graal.js" # String, the name of the script engine to use, only for 'script' authentication
          username: testuser@mailboxsweep.local
          loginPostUrl: http://localhost:8080/login
          host: localhost
          tempLoginServerSenderPort: "8082"
        verification:
          method: poll # String, one of 'response', 'request', 'both', 'poll'
          loggedInRegex: address # String, regex pattern for determining if logged in
          # loggedOutRegex: # String, regex pattern for determining if logged out
          pollFrequency: 15
          pollUnits: seconds
          pollUrl: http://localhost:8080/user # String, the URL to poll, only for 'poll' verification
          # pollPostData: # String, post dat to include in the poll, only for 'poll' verification
          # pollAdditionalHeaders: # List of additional headers for poll request, only for 'poll' verification
          #   - header: # The header name
          #     value: # The header value
      sessionManagement:
        method: cookie # String, one of 'cookie', 'http', 'script'
        # parameters: # List of 0 or more parameters - may include any required for scripts
        #   script: # String, path to script, only for 'script' session management
        #   scriptEngine: # String, the name of the script engine to use, only for 'script' session management
      technology:
        exclude: [] # List of tech to exclude, as per https://www.zaproxy.org/techtags/ (just use last names)
      users: # List of one or more users available to use for authentication
        - name: testuser@mailboxsweep.local # String, the name to be used by the jobs
          credentials: # List of user credentials - may include any required for scripts, vars supported
            username: testuser@mailboxsweep.local
  vars: # List of 0 or more variables, can be used in urls and selected other parameters
  parameters:
    failOnError: true # If set exit on an error
    failOnWarning: false # If set exit on a warning
    progressToStdout: true # If set will write job progress to stdout

jobs:
  - type: openapi
    name: openapi
    parameters:
      apiFile: openapi.yml
      context: MailboxSweep
      targetUrl: http://localhost:8080

  - type: spider
    name: spider
    parameters:
      acceptCookies: true
      context: MailboxSweep
      handleODataParametersVisited: false
      handleParameters: USE_ALL
      maxChildren: 0
      maxDepth: 5
      maxDuration: 0
      maxParseSizeBytes: 2621440
      parseComments: true
      parseDsStore: false
      parseGit: false
      parseRobotsTxt: true
      parseSVNEntries: false
      parseSitemapXml: true
      postForm: true
      processForm: true
      requestWaitTime: 200
      sendRefererHeader: true
      threadCount: 16
      url: http://localhost:3000

  - type: spiderAjax
    name: spiderAjax
    parameters:
      browserId: firefox-headless
      clickDefaultElems: true
      clickElemsOnce: true
      context: MailboxSweep
      eventWait: 1000
      maxCrawlDepth: 10
      maxCrawlStates: 0
      maxDuration: 60
      numberOfBrowsers: 16
      randomInputs: true
      reloadWait: 1000
      runOnlyIfModern: false
      url: http://localhost:3000
      user: testuser@mailboxsweep.local

  - type: activeScan
    name: activeScan
    parameters:
      addQueryParam: false
      context: MailboxSweep
      # defaultPolicy:
      delayInMs: 0
      handleAntiCSRFTokens: true
      injectPluginIdInHeader: false
      maxAlertsPerRule: 0
      maxRuleDurationInMins: 0
      maxScanDurationInMins: 0
      scanHeadersAllRequests: false
      # scanNullJsonValues: false
      threadPerHost: 16

  - type: report
    name: report
    parameters:
      displayReport: false
      reportDescription:
      reportDir: /home/nathan
      reportFile: null
      reportTitle: ZAP Scanning Report
      template: risk-confidence-html
      theme: null
