version: "3.8"

services:
  localstack:
    container_name: localstack
    image: localstack/localstack:3.0.2
    ports:
      - "4566:4566" # LocalStack Gateway
      - "4510-4559:4510-4559" # external services port range
    volumes:
      - "./volumes/localstack:/var/lib/localstack"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - awslocal dynamodb list-tables
          && awslocal s3 ls
          && awslocal sqs list-queues
      interval: 5s
      timeout: 10s
      start_period: 10s

  mailserver:
    container_name: mailserver
    image: foxcpp/maddy:0.7
    ports:
      - "3025:25" # SMTP inbound
      - "465:465" # SMTP submission
      - "587:587" # SMTP submission
      - "993:993" # IMAP4
      - "143:143" # IMAP4
    volumes:
      - ./volumes/maddy:/data
    environment:
      - MADDY_DOMAIN=mailboxsweep.local
      - MADDY_HOSTNAME=mx.mailboxsweep.local
    restart: always
