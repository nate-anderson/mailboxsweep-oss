name: CI

on:
  push:
    branches: [develop]

jobs:
  build-backend:
    name: Build, lint and test backend
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - "4566:4566" # LocalStack Gateway
          - "4510-4559:4510-4559" # external services port range
        volumes:
          - "localstack:/tmp/localstack"

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: "^1.21.0"
          cache-dependency-path: backend/go.sum

      - name: Install server generator
        working-directory: backend
        run: make install_openapi_generator

      - name: Generate server code
        working-directory: backend
        run: make http_scaffold

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: backend
          version: latest
          skip-pkg-cache: true
          skip-build-cache: true
          args: --timeout=10m

      - name: Test
        working-directory: backend
        run: go test ./... -timeout=3m
        env:
          AWS_ACCESS_KEY_ID: test_none
          AWS_SECRET_ACCESS_KEY: test_none
          TEST_ADDRESS: ${{ secrets.TEST_ADDRESS }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_IMAP_HOST: imap.gmail.com
          TEST_SMTP_HOST: smtp.gmail.com
          TEST_IMAP_PORT: 993
          TEST_SMTP_PORT: 587
          DYNAMODB_HOST: localhost
          S3_HOST: localhost

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        with:
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-push-server-image:
    name: Build and push server image to ECR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      - name: Build, tag, push image (server)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mailboxsweep-server-staging
          IMAGE_TAG: server_${{ github.sha }}
        run: |
          docker build -f ./backend/Dockerfile.server -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t latest -t mailboxsweep-server .
          docker tag mailboxsweep-server:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

  build-push-worker-image:
    name: Build and push worker image to ECR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      - name: Build, tag, push image (worker)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mailboxsweep-worker-staging
          IMAGE_TAG: worker_${{ github.sha }}
        run: |
          docker build -f ./backend/Dockerfile.worker -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t latest -t mailboxsweep-worker .
          docker tag mailboxsweep-worker:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

  # deploy-infrastructure:
  #   name: Deploy CDK staging stack
  #   @TODO

  build-web:
    name: Build and upload web frontend artifacts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Version Spec of the version to use in SemVer notation.
          # It also emits such aliases as lts, latest, nightly and canary builds
          # Examples: 12.x, 10.15.1, >=10.15.0, lts/Hydrogen, 16-nightly, latest, node
          node-version: "18.16.0"
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Generate API client
        working-directory: web
        run: npm run openapi

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Build (staging)
        working-directory: web
        run: npm run build:staging

      - name: Robots.txt (staging)
        working-directory: web
        run: npm run robots:staging

      - name: Compress staging build
        working-directory: web
        run: cd out && zip -r ../staging.zip .

      - name: Push to S3 (staging)
        working-directory: web/out
        env:
          BUCKET: com.mailboxsweep.staging.web
        run: aws s3 sync . s3://$BUCKET --delete

      - name: Invalidate CloudFront distribution
        env:
          DISTRIBUTION: E12RGUT06QPULN
        run: aws cloudfront create-invalidation --distribution-id $DISTRIBUTION --paths "/*"

      # - name: Build (prod)
