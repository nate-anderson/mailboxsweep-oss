name: Build and test Go package

on: [push]

jobs:
  build-backend:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - "4566:4566" # LocalStack Gateway
          - "4510-4559:4510-4559" # external services port range
        volumes:
          - "localstack:/tmp/localstack"

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: "^1.20.0"
          cache-dependency-path: backend/go.sum

      # - id: go-cache-paths
      #   name: pre-cache
      #   run: |
      #     echo "::set-output name=go-build::$(go env GOCACHE)"
      #     echo "::set-output name=go-mod::$(go env GOMODCACHE)"

      - uses: actions/checkout@v3

      # Cache go build cache, used to speedup go test
      # - name: Go Build Cache
      #   uses: actions/cache@v2
      #   with:
      #     path: ${{ steps.go-cache-paths.outputs.go-build }}
      #     key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}

      # # Cache go mod cache, used to speedup builds
      # - name: Go Mod Cache
      #   uses: actions/cache@v2
      #   with:
      #     path: ${{ steps.go-cache-paths.outputs.go-mod }}
      #     key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      # - name: start containers
      #   run: cd backend && make up

      - name: Install server generator
        working-directory: backend
        run: make install_openapi_generator

      - name: Generate server code
        working-directory: backend
        run: make http_scaffold

      # - name: Lint
      #   uses: golangci/golangci-lint-action@v3
      #   with:
      #     working-directory: backend

      - name: Test
        working-directory: backend
        run: go test ./... -timeout=3m
        env:
          AWS_ACCESS_KEY_ID: test_none
          AWS_SECRET_ACCESS_KEY: test_none
          TEST_ADDRESS: ${{ secrets.TEST_ADDRESS }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_IMAP_HOST: imap.gmail.com
          TEST_SMTP_HOST: smtp.gmail.com
          TEST_IMAP_PORT: 993
          TEST_SMTP_PORT: 587
          DYNAMODB_HOST: localhost
          S3_HOST: localhost

  build-push-server-image:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, push image (server)
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mailboxsweep-server
          IMAGE_TAG: server_${{ github.sha }}
        run: |
          docker build -f Dockerfile.server -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --all-tags

  build-push-worker-image:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, push image (worker)
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mailboxsweep-worker
          IMAGE_TAG: worker_${{ github.sha }}
        run: |
          docker build -f Dockerfile.worker -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --all-tags

  build-web:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Version Spec of the version to use in SemVer notation.
          # It also emits such aliases as lts, latest, nightly and canary builds
          # Examples: 12.x, 10.15.1, >=10.15.0, lts/Hydrogen, 16-nightly, latest, node
          node-version: "18.16.0"
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Generate API client
        working-directory: web
        run: npm run openapi

      # - name: Lint
      #   working-directory: web
      #   run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
