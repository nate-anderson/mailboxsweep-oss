name: Build and test Go package

on: [push]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - "4566:4566" # LocalStack Gateway
          - "4510-4559:4510-4559" # external services port range
        volumes:
          - "localstack:/tmp/localstack"

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: "^1.20.0"

      - id: go-cache-paths
        name: pre-cache
        run: |
          echo "::set-output name=go-build::$(go env GOCACHE)"
          echo "::set-output name=go-mod::$(go env GOMODCACHE)"

      - uses: actions/checkout@v3

      # Cache go build cache, used to speedup go test
      - name: Go Build Cache
        uses: actions/cache@v2
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}

      # Cache go mod cache, used to speedup builds
      - name: Go Mod Cache
        uses: actions/cache@v2
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      # - name: start containers
      #   run: cd backend && make up

      - name: Install server generator
        run: cd backend && make install_openapi_generator

      - name: Generate server code
        run: cd backend && make http_scaffold

      # - name: Lint
      #   uses: golangci/golangci-lint-action@v3
      #   with:
      #     working-directory: backend

      - name: Test
        run: cd backend && go test ./... -timeout=3m
        env:
          AWS_ACCESS_KEY_ID: test_none
          AWS_SECRET_ACCESS_KEY: test_none
          TEST_ADDRESS: ${{ secrets.TEST_ADDRESS }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_IMAP_HOST: imap.gmail.com
          TEST_SMTP_HOST: smtp.gmail.com
          TEST_IMAP_PORT: 993
          TEST_SMTP_PORT: 587
          DYNAMODB_HOST: localhost
          S3_HOST: localhost

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, push image (server)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mailboxsweep-repo-prod
          IMAGE_TAG: server_${{ steps.commit.outputs.short }}
        run: |
          cd backend && make build_docker_server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build, tag, push image (worker)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mailboxsweep-repo-prod
          IMAGE_TAG: worker_${{ steps.commit.outputs.short }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
