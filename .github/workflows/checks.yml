name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-test-backend.yml@07f5fda0387b443a9bf68d8139afbaefe60f300a

  build-web:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-web.yml@07f5fda0387b443a9bf68d8139afbaefe60f300a

  test-e2e:
    uses: nate-anderson/mailboxsweep/.github/workflows/e2e.yml@07f5fda0387b443a9bf68d8139afbaefe60f300a
    secrets: inherit
