name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-test-backend.yml@7e715ce6d3ae607887bf71daa0c7b0cad26e3643

  build-web:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-web.yml@7e715ce6d3ae607887bf71daa0c7b0cad26e3643

  test-e2e:
    uses: nate-anderson/mailboxsweep/.github/workflows/e2e.yml@7e715ce6d3ae607887bf71daa0c7b0cad26e3643
    secrets: inherit
