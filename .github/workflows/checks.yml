name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    uses: nate-anderson/mailboxsweep/.github/workflows/build-test-backend.yml@8cb80d53bab9f0cd759f1f94553ccddf0087c247

  build-web:
    runs-on: ubuntu-latest
    uses: nate-anderson/mailboxsweep/.github/workflows/build-web.yml@8cb80d53bab9f0cd759f1f94553ccddf0087c247

  test-e2e:
    runs-on: ubuntu-latest
    uses: nate-anderson/mailboxsweep/.github/workflows/e2e.yml@8cb80d53bab9f0cd759f1f94553ccddf0087c247
