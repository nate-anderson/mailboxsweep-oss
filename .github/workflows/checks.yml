name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/workflows/build-test-backend.yml

  build-web:
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/workflows/build-web.yml

  test-e2e:
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/workflows/e2e.yml
