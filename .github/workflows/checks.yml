name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-test-backend.yml@3906188e2864c23a427cf0ac2e5390ebe38a59c3

  build-web:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-web.yml@3906188e2864c23a427cf0ac2e5390ebe38a59c3

  test-e2e:
    uses: nate-anderson/mailboxsweep/.github/workflows/e2e.yml@3906188e2864c23a427cf0ac2e5390ebe38a59c3
    secrets: inherit
