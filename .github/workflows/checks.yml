name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-test-backend.yml@${GITHUB_SHA}

  build-web:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-web.yml@${GITHUB_SHA}

  test-e2e:
    uses: nate-anderson/mailboxsweep/.github/workflows/e2e.yml@${GITHUB_SHA}
    secrets: inherit
