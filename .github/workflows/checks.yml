name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-test-backend.yml@0aaf13faf42479b9f12483958a53e00789e934b7

  build-web:
    uses: nate-anderson/mailboxsweep/.github/workflows/build-web.yml@0aaf13faf42479b9f12483958a53e00789e934b7

  test-e2e:
    uses: nate-anderson/mailboxsweep/.github/workflows/e2e.yml@0aaf13faf42479b9f12483958a53e00789e934b7
    secrets: inherit
