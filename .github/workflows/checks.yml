name: PR Checks

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    name: Build, lint and test backend
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - "4566:4566" # LocalStack Gateway
          - "4510-4559:4510-4559" # external services port range
        volumes:
          - "localstack:/tmp/localstack"

      mailserver:
        image: foxcpp/maddy:0.7
        ports:
          - "3025:25" # SMTP inbound
          - "465:465" # SMTP submission
          - "587:587" # SMTP submission
          - "993:993" # IMAP4
          - "143:143" # IMAP4
        volumes:
          - "maddy:/data"
        env:
          MADDY_DOMAIN: mailboxsweep.local
          MADDY_HOSTNAME: mx.mailboxsweep.local

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: "^1.21.0"
          cache-dependency-path: backend/go.sum

      - name: Install server generator
        working-directory: backend
        run: make install_openapi_generator

      - name: Generate server code
        working-directory: backend
        run: make http_scaffold

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: backend
          version: latest
          skip-pkg-cache: true
          skip-build-cache: true
          args: --timeout=10m

      - name: Test
        working-directory: backend
        run: go test ./... -timeout=3m
        env:
          AWS_ACCESS_KEY_ID: test_none
          AWS_SECRET_ACCESS_KEY: test_none
          TEST_ADDRESS: testuser@mailboxsweep.local
          TEST_PASSWORD: pass123
          TEST_IMAP_HOST: localhost
          TEST_SMTP_HOST: localhost
          TEST_IMAP_PORT: 993
          TEST_SMTP_PORT: 587
          DYNAMODB_HOST: localhost
          S3_HOST: localhost

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        with:
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-web:
    name: Build and upload web frontend artifacts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Version Spec of the version to use in SemVer notation.
          # It also emits such aliases as lts, latest, nightly and canary builds
          # Examples: 12.x, 10.15.1, >=10.15.0, lts/Hydrogen, 16-nightly, latest, node
          node-version: "18.16.0"
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Generate API client
        working-directory: web
        run: npm run openapi

      - name: Lint
        working-directory: web
        run: npm run lint
