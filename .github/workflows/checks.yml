name: PR Checks

#
# Pull request checks to be run against every branch that may be merged into develop
#

on:
  push:
    branches-ignore: [develop, main]

jobs:
  build-backend:
    name: Build, lint and test backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: "^1.21.0"
          cache-dependency-path: backend/go.sum

      - name: Install server generator
        working-directory: backend
        run: make install_openapi_generator

      - name: Generate server code
        working-directory: backend
        run: make http_scaffold

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: backend
          version: latest
          skip-pkg-cache: true
          skip-build-cache: true
          args: --timeout=10m

      - name: Start containers
        working-directory: backend
        run: make maddy_init_setup

      - name: Test
        working-directory: backend
        run: go test ./... -timeout=3m
        env:
          AWS_ACCESS_KEY_ID: test_none
          AWS_SECRET_ACCESS_KEY: test_none
          TEST_ADDRESS: testuser@mailboxsweep.local
          TEST_PASSWORD: pass123
          TEST_IMAP_HOST: localhost
          TEST_SMTP_HOST: localhost
          TEST_IMAP_PORT: 993
          TEST_SMTP_PORT: 587
          DYNAMODB_HOST: localhost
          S3_HOST: localhost

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        with:
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-web:
    name: Build web frontend artifacts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Version Spec of the version to use in SemVer notation.
          # It also emits such aliases as lts, latest, nightly and canary builds
          # Examples: 12.x, 10.15.1, >=10.15.0, lts/Hydrogen, 16-nightly, latest, node
          node-version: "18.16.0"
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Generate API client
        working-directory: web
        run: npm run openapi

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  test-e2e:
    name: Run end-to-end tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-web
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: "^1.21.0"
          cache-dependency-path: backend/go.sum

      - name: Install server generator
        working-directory: backend
        run: make install_openapi_generator

      - name: Generate server code
        working-directory: backend
        run: make http_scaffold

      - name: Start API server (background)
        working-directory: backend
        run: make start_e2e_server &

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Generate API client
        working-directory: web
        run: npm run openapi

      - name: Build
        working-directory: web
        run: npm run build

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e
