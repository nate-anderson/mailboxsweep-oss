openapi: 3.0.0
info:
  version: 0.0.1
  title: Mailboxsweep Public API

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: X-MailboxSweep-Session
  schemas:
    ChangeSet:
      type: object
      required:
        - folder
        - operation
        - paths
      properties:
        paths:
          type: array
          items:
            type: string
        folder:
          type: string
        operation:
          $ref: '#/components/schemas/UpdateOperation'

    ChangeSetRequest:
      type: object
      required:
        - path
        - folder
        - operation
      properties:
        path:
          type: array
          items:
            type: string
        folder:
          type: string
        operation:
          $ref: '#/components/schemas/UpdateOperation'
    
    ChangeSetResponse:
      type: object
      required:
        - changeSets
        - address
      properties:
        changeSets:
          type: array
          items:
            $ref: '#/components/schemas/ChangeSet'
        address:
          type: string

    Classification:
      type: object
      required:
        - count
        - label
        - dimension
        - children
      properties:
        count:
          type: integer
        label:
          type: string
        typeKey:
          type: string
        dimension:
          type: string
        children:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Classification'

    ClassificationResponse:
      type: object
      required:
        - classification
      properties:
        classification:
          $ref: '#/components/schemas/Classification'

    ClassificationStatus:
      type: object
      required:
        - startedAt
        - status
      properties:
        startedAt:
          type: string
        status:
          type: string
          enum:
            - in_progress
            - complete
            - errored

    ClassificationStatusResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
        status:
          $ref: '#/components/schemas/ClassificationStatus'

    Classifier:
      type: object
      required:
        - typeKey
      properties:
        typeKey:
          type: string
          description: the type key of the classifier
        initValue:
          type: string
          description: the optional initializer for thie classifier
    
    CommitRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: boolean

    ClassifierInfo:
      type: object
      required:
        - name
        - description
        - typeKey
        - hasInput
      properties:
        name:
          type: string
          description: display name
        description:
          type: string
          description: detailed description
        typeKey:
          type: string
          description: the type key of the classifier
        hasInput:
          type: boolean
          description: does this classifier take input?
        inputLabel:
          type: string
          description: display label for the input 
        inputFormat:
          $ref: '#/components/schemas/InputFormat'

    CreateCredentialRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string

    CreateCredentialResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
    
    FolderMessageCount:
      type: object
      required:
        - folder
        - allMessages
        - unreadMessages
      properties:
        folder:
          type: string
        allMessages:
          type: integer
        unreadMessages:
          type: integer

    GetCredentialResponse:
      type: object
      required:
        - address
        - created
        - expires
      properties:
        address:
          type: string
        created:
          type: string
        expires:
          type: string

    GetFoldersResponse:
      type: object
      required:
        - address
        - folders
      properties:
        address:
          type: string
        folders:
          type: array
          items:
            $ref: '#/components/schemas/FolderMessageCount'

    InitiatePaymentRequest:
      type: object
      required:
        - plan
      properties:
        plan:
          type: string
    
    InitiatePaymentResponse:
      type: object
      required:
        - checkoutUrl
      properties:
        checkoutUrl:
          type: string
          nullable: true
    
    InputFormat:
      type: string
      enum:
        - date
        - string

    ListClassifiersResponse:
      type: object
      required:
        - classifiers
      properties:
        classifiers:
          type: array
          items:
            $ref: '#/components/schemas/ClassifierInfo'

    ListPlansResponse:
      type: object
      required:
        - plans
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'

    ListUserAgreementsResponse:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            $ref: '#/components/schemas/UserAgreement'

    LoginRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    LoginResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    MessagePreview:
      type: object
      required:
        - sender
      properties:
        sender:
          $ref: '#/components/schemas/Sender'
        subject:
          type: string

    Plan:
      type: object
      required:
        - key
        - displayName
        - description
        - features
        - allowedScans
        - durationDays
        - priceInCents
      properties:
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string
        allowedScans:
          type: integer
        durationDays:
          type: integer
        priceInCents:
          type: integer

    Sender:
      type: object
      required:
        - address
      properties:
        name:
          type: string
        addres:
          type: string

    SetUserAgreementsRequest:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            type: string
    
    SetUserAgreementsResponse:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            type: string

    SetUserNameRequest:
      type: object
      required:
        - nameFirst
        - nameLast
      properties:
        nameFirst:
          type: string
        nameLast:
          type: string

    StartInboxClassifyRequest:
      type: object
      required:
        - folders
        - classifiers
      properties:
        folders:
          type: array
          items:
            type: string
        classifiers:
          type: array
          items:
            $ref: '#/components/schemas/Classifier'
    
    StartLoginResponse:
      type: object
      required:
        - redirectToSignup
      properties:
        redirectToSignup:
          type: boolean

    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        message:
          type: string

    StoreImapServerAndCredentialsRequest:
      type: object
      required:
        - password
        - imapHost
        - imapPort
      properties:
        password:
          type: string
        imapHost:
          type: string
        imapPort:
          type: integer

    UpdateChangeSetResponse:
      type: object
      required:
        - folder
        - messageCount # number of messages added or removed
      properties:
        folder:
          type: string
        messageCount:
          type: integer

    UpdateOperation:
      type: string
      enum:
        - delete
        - mark_read
    
    UserAgreement:
      type: object
      required:
        - key
        - name
        - required
        - agreedAt
      properties:
        key:
          type: string
        agreedAt:
          nullable: true
          type: string # RFC-3339 datetime string
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
        body:
          type: string
        agreementUpdatedAt:
          type: string

    UserData:
      type: object
      required:
        - address
      properties:
        address:
          type: string
        nameFirst:
          type: string
        nameLast:
          type: string

    UserPaymentStatus:
      type: object
      required:
        - plan
        - validUntil
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
          nullable: true
        validUntil:
          type: string
          nullable: true
        subscribedAt:
          type: string
          nullable: true

security:
  - cookieAuth: []

paths:
  /classifiers:
    operationId: getClassifiers
    get:
      description: List available classifiers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClassifiersResponse'

  /credential:
    post:
      operationId: storeInboxCredential
      description: Add credentials to access an inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

    get:
      operationId: getInboxCredential
      description: Get the currently in-use credential
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCredentialResponse'
        '404':
          description: Not found - probably not created

  /imap/server:
    post:
      operationId: storeImapServerAndCredentials
      description: Store connection details and credentials for a new IMAP server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreImapServerAndCredentialsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /user:
    get:
      operationId: getUserData
      description: Get user basic data
      responses:
        '200':
          description: Success, user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '401':
          description: Unauthorized

  /user/name:
    patch:
      operationId: updateUserName
      description: Set user name for an inbox account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserNameRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /user/agreements:
    get:
      operationId: listUserAgreements
      description: See agreed and outstanding agreements
      responses:
        '200':
          description: Success, agreement list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserAgreementsResponse'
    patch:
      operationId: setConsentedAgreements
      description: Set agreed agreements for an inbox accoutn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserAgreementsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetUserAgreementsResponse'
        '400':
          description: Bad request
        '500':
          Description: Internal server error

  /user/agreements/{agreementSlug}:
    operationId: getUserAgreement
    get:
      description: Get agreement
      parameters:
        - in: path
          name: agreementSlug
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref:
                  '#/components/schemas/UserAgreement'
        '404':
          description: Not found

  /inbox/changeset:
    patch:
      operationId: updateChangeSet
      description: Append leaf for update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSetRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChangeSetResponse'
        '404':
          description: Not found
        '500':
          description: Internal server error

    get:
      operationId: getChangesets
      description: Get the current paths and operations the user has selected for update
      parameters:
        - in: query
          name: folder
          schema:
            type: string
          required: false
          description: Pass a folder name to get changesets just for that folder
      responses:
        '200':
          description: Success, list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSetResponse'

  /inbox/changeset/commit:
    post:
      operationId: commitChangesets
      description: Commit pending deletes/mark reads selected for this inbox's folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Success, committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad or unconfirmed request
        '500':
          description: Internal server error

  /inbox/classification:
    post:
      operationId: startClassify
      description: Begin classifying inbox messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInboxClassifyRequest'
      responses:
        '202':
          description: Success, processing has been enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error
    
    get:
      operationId: getClassificationLeaf
      description: Get classification leaf by path
      responses:
        '200':
          description: Success, classification leaf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '404':
          description: Inbox or leaf not found
        '500':
          description: Internal server error

  /inbox/classification/summary:
    get:
      operationId: getClassificationSummary
      description: Get the summary tree of inbox classifications
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          required: false
          description: Result page to fetch, defaults to 0 == first page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '404':
          description: Not found
        '500':
          description: Internal server error
  
  /inbox/classification/status:
    get:
      operationId: getClassificationStatus
      description: Get the status of the current classification request for this account (if any)
      responses:
        '200':
          description: Classification status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationStatusResponse'
        '500':
          description: Internal server error

  /inbox/folders:
    get:
      operationId: getInboxFolders
      description: List inbox folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFoldersResponse'

  /plans:
    get:
      description: Get available plans
      operationId: listPlans
      responses:
        '200':
          description: Success, list of plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlansResponse'
        '500':
          description: Internal server errror

  /payment:
    get:
      description: Get payment details
      operationId: getPaymentStatus
      responses:
        '200':
          description: Success - payment details enclosed. Status code does not reflect payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPaymentStatus'
        '500':
          description: Internal server error

    post:
      description: Initiate payment
      operationId: initiatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '200':
          description: Payment initiated, follow redirect link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '500':
          description: Internal server error

  /payment/success:
    get:
      description: Submit payment success details
      operationId: completePayment
      parameters:
        - in: query
          name: checkoutSessionId
          required: true
          schema:
            type: string
          description: Stripe checkout session ID 
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          description: Internal server error

  # Note:
  # Paths prefixed with /login do not require authentication!
  # /login paths are public

  /login:
    post:
      operationId: initiateLogin
      description: Initiate login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResponse'
        '401':
          description: Auth failure
  
  /login/{token}/{signature}:
    get:
      operationId: submitLoginToken
      description: Complete login
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Auth failure
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
        - in: path
          name: signature
          schema:
            type: string
          required: true
