openapi: 3.0.0
info:
  version: 0.0.1
  title: Mailboxsweep Public API

components:
  schemas:

    ChangeSetRequest:
      type: object
      required:
        - path
        - folder
        - operation
      properties:
        path:
          type: array
          items:
            type: string
        folder:
          type: string
        operation:
          $ref: '#/components/schemas/UpdateOperation'

    Classification:
      type: object
      required:
        - count
        - label
        - dimension
        - children
      properties:
        count:
          type: integer
        label:
          type: string
        dimension:
          type: string
        children:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Classification'

    ClassificationResponse:
      type: object
      required:
        - classification
      properties:
        classification:
          $ref: '#/components/schemas/Classification'

    Classifier:
      type: object
      required:
        - typeKey
      properties:
        typeKey:
          type: string
          description: the type key of the classifier
        initValue:
          type: string
          description: the optional initializer for thie classifier
    
    ClassifierInfo:
      type: object
      required:
        - name
        - description
        - typeKey
        - hasInput
      properties:
        name:
          type: string
          description: display name
        description:
          type: string
          description: detailed description
        typeKey:
          type: string
          description: the type key of the classifier
        hasInput:
          type: boolean
          description: does this classifier take input?
        inputDescription:
          type: string
          description: what is the input of this classifier?

    CreateCredentialRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string

    CreateCredentialResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
    
    GetCredentialResponse:
      type: object
      required:
        - address
        - created
        - expires
      properties:
        address:
          type: string
        created:
          type: string
        expires:
          type: string

    GetFoldersResponse:
      type: object
      required:
        - address
        - folders
      properties:
        address:
          type: string
        folders:
          type: array
          items:
            type: string
    
    ListClassifiersResponse:
      type: object
      required:
        - classifiers
      properties:
        classifiers:
          type: array
          items:
            $ref: '#/components/schemas/ClassifierInfo'

    LoginRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    LoginResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    MessagePreview:
      type: object
      required:
        - sender
      properties:
        sender:
          $ref: '#/components/schemas/Sender'
        subject:
          type: string

    Sender:
      type: object
      required:
        - address
      properties:
        name:
          type: string
        addres:
          type: string

    SetUserAgreementsRequest:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            type: string
    
    SetUserAgreementsResponse:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            type: string

    SetUserNameRequest:
      type: object
      required:
        - nameFirst
        - nameLast
      properties:
        nameFirst:
          type: string
        nameLast:
          type: string

    StartInboxClassifyRequest:
      type: object
      required:
        - folders
        - classifiers
      properties:
        folders:
          type: array
          items:
            type: string
        classifiers:
          type: array
          items:
            $ref: '#/components/schemas/Classifier'
    
    StartLoginResponse:
      type: object
      required:
        - redirectToSignup
      properties:
        redirectToSignup:
          type: boolean

    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        message:
          type: string

    UpdateOperation:
      type: string
      enum:
        - delete
        - mark_read

paths:
  /classifiers:
    get:
      description: List available classifiers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClassifiersResponse'

  /credential:
    post:
      description: Add credentials to access an inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

    get:
      description: Get the currently in-use credential
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCredentialResponse'
        '404':
          description: Not found - probably not created

  /user/name:
    patch:
      description: Set user name for an inbox account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserNameRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /user/agreements:
    patch:
      description: Set agreed agreements for an inbox accoutn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserAgreementsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetUserAgreementsResponse'
        '400':
          description: Bad request
        '500':
          Description: Internal server error

  /inbox/changeset:
    patch:
      description: Append leaf for update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSetRequest'

  /inbox/classification:
    post:
      description: Begin classifying inbox messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInboxClassifyRequest'
      responses:
        '202':
          description: Success, processing has been enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error
    
    get:
      description: Get classification leaf by path
      responses:
        '200':
          description: Success, classification leaf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '404':
          description: Inbox or leaf not found
        '500':
          description: Internal server error

  /inbox/classification/summary:
    get:
      description: Get the summary tree of inbox classifications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '202':
          description: Classification still pending
        '404':
          description: Not found
        '500':
          description: Internal server error

  /inbox/folders:
    get:
      description: List inbox folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFoldersResponse'

  /login:
    post:
      description: Initiate login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResponse'
        '401':
          description: Auth failure
  
  /login/{token}:
    get:
      description: Complete login
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Auth failure
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
