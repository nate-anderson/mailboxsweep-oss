openapi: 3.0.0
info:
  version: 0.0.1
  title: Mailboxsweep Public API

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: X-MailboxSweep-Session
  schemas:
    ChangeSet:
      type: object
      required:
        - operation
        - paths
      properties:
        paths:
          type: array
          items:
            type: array
            items:
              type: string
        operation:
          $ref: "#/components/schemas/UpdateOperation"

    ChangeSetRequest:
      type: object
      required:
        - path
        - operation
        - addOrRemove
      properties:
        # this can be a path prefix, the backend will act on all leaves
        # underneath this
        path:
          type: array
          items:
            type: string
        operation:
          $ref: "#/components/schemas/UpdateOperation"
        addOrRemove:
          type: string
          enum:
            - add
            - remove

    ChangeSetResponse:
      type: object
      required:
        - changeSet
        - address
        - size
      properties:
        changeSet:
          $ref: "#/components/schemas/ChangeSet"
        address:
          type: string
        size:
          type: integer

    Classification:
      type: object
      required:
        - count
        - unreadCount
        - label
        - dimension
        - children
        - subjectPreviews
      properties:
        count:
          type: integer
        unreadCount:
          type: integer
        label:
          type: string
        typeKey:
          type: string
        dimension:
          type: string
        children:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Classification"
        subjectPreviews:
          type: array
          items:
            type: string

    ClassificationResponse:
      type: object
      required:
        - classification
        - pageCount
      properties:
        classification:
          $ref: "#/components/schemas/Classification"
        pageCount:
          type: integer

    ClassificationStatus:
      type: object
      required:
        - startedAt
        - status
      properties:
        startedAt:
          type: string
        status:
          type: string
          enum:
            - in_progress
            - complete
            - errored
            - executed
        details:
          type: string

    ClassificationStatusResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
        status:
          $ref: "#/components/schemas/ClassificationStatus"

    Classifier:
      type: object
      required:
        - typeKey
      properties:
        typeKey:
          type: string
          description: the type key of the classifier
        initValue:
          type: string
          description: the optional initializer for thie classifier

    CommitRequest:
      type: object
      required:
        - operation
        - confirm
      properties:
        confirm:
          type: boolean
        operation:
          $ref: "#/components/schemas/UpdateOperation"

    ClassifierInfo:
      type: object
      required:
        - name
        - description
        - typeKey
        - hasInput
      properties:
        name:
          type: string
          description: display name
        description:
          type: string
          description: detailed description
        typeKey:
          type: string
          description: the type key of the classifier
        hasInput:
          type: boolean
          description: does this classifier take input?
        inputLabel:
          type: string
          description: display label for the input
        inputFormat:
          $ref: "#/components/schemas/InputFormat"

    CreateCredentialRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string

    CreateCredentialResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    GetCredentialResponse:
      type: object
      required:
        - address
        - created
        - expires
        - type
      properties:
        address:
          type: string
        created:
          type: string
        expires:
          type: string
        type:
          type: string
          enum:
            - gmail
            - imap

    InboxMetadataResponse:
      type: object
      required:
        - address
        - messageCount
        - unreadCount
        - folders
      properties:
        address:
          type: string
        messageCount:
          type: integer
        unreadCount:
          type: integer
        folders:
          type: array
          items:
            type: string

    InitiatePaymentRequest:
      type: object
      required:
        - plan
      properties:
        plan:
          type: string

    InitiatePaymentResponse:
      type: object
      required:
        - checkoutUrl
      properties:
        checkoutUrl:
          type: string
          nullable: true

    InputFormat:
      type: string
      enum:
        - date
        - string

    ListClassifiersResponse:
      type: object
      required:
        - classifiers
      properties:
        classifiers:
          type: array
          items:
            $ref: "#/components/schemas/ClassifierInfo"

    ListPlansResponse:
      type: object
      required:
        - plans
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"

    ListUserAgreementsResponse:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            $ref: "#/components/schemas/UserAgreement"

    LoginRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    LoginResponse:
      type: object
      required:
        - address
        - redirectToSignup
      properties:
        address:
          type: string
        redirectToSignup:
          type: boolean

    MessagePreview:
      type: object
      required:
        - sender
      properties:
        sender:
          $ref: "#/components/schemas/Sender"
        subject:
          type: string

    Plan:
      type: object
      required:
        - key
        - displayName
        - description
        - features
        - allowedScans
        - durationDays
        - priceInCents
      properties:
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string
        allowedScans:
          type: integer
        durationDays:
          type: integer
        priceInCents:
          type: integer

    Sender:
      type: object
      required:
        - address
      properties:
        name:
          type: string
        addres:
          type: string

    SetUserAgreementsRequest:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            type: string

    SetUserAgreementsResponse:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            type: string

    SetUserNameRequest:
      type: object
      required:
        - nameFirst
        - nameLast
      properties:
        nameFirst:
          type: string
        nameLast:
          type: string

    StartInboxClassifyRequest:
      type: object
      required:
        - folders
        - classifiers
      properties:
        folders:
          type: array
          items:
            type: string
        classifiers:
          type: array
          items:
            $ref: "#/components/schemas/Classifier"

    StartLoginResponse:
      type: object
      required:
        - ok
        - redirect
      properties:
        ok:
          type: boolean
        redirect:
          type: boolean
        redirectUrl:
          type: string

    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        message:
          type: string

    StoreImapServerAndCredentialsRequest:
      type: object
      required:
        - password
        - imapHost
        - imapPort
      properties:
        password:
          type: string
        imapHost:
          type: string
        imapPort:
          type: integer

    UpdateChangeSetResponse:
      type: object
      required:
        - messageCount # number of messages added or removed
        - updatedPaths
      properties:
        messageCount:
          type: integer
        updatedPaths:
          type: array
          items:
            type: array
            items:
              type: string

    UpdateOperation:
      type: string
      enum:
        - delete
        - mark_read

    UserAgreement:
      type: object
      required:
        - key
        - name
        - required
        - agreedAt
      properties:
        key:
          type: string
        agreedAt:
          nullable: true
          type: string # RFC-3339 datetime string
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
        body:
          type: string
        agreementUpdatedAt:
          type: string

    UserData:
      type: object
      required:
        - address
      properties:
        address:
          type: string
        nameFirst:
          type: string
        nameLast:
          type: string

    UserPaymentStatus:
      type: object
      required:
        - plan
        - validUntil
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
          nullable: true
        validUntil:
          type: string
          nullable: true
        subscribedAt:
          type: string
          nullable: true

security:
  - cookieAuth: []

paths:
  /classifiers:
    operationId: getClassifiers
    get:
      description: List available classifiers
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClassifiersResponse"

  /credential:
    post:
      operationId: storeInboxCredential
      description: Add credentials to access an inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredentialRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCredentialResponse"
        "400":
          description: Bad request
        "500":
          description: Internal server error

    get:
      operationId: getInboxCredential
      description: Get the currently in-use credential
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCredentialResponse"
        "404":
          description: Not found - probably not created

  /imap/server:
    post:
      operationId: storeImapServerAndCredentials
      description: Store connection details and credentials for a new IMAP server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreImapServerAndCredentialsRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCredentialResponse"
        "400":
          description: Bad request
        "500":
          description: Internal server error

  /user:
    get:
      operationId: getUserData
      description: Get user basic data
      responses:
        "200":
          description: Success, user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "401":
          description: Unauthorized

  /user/name:
    patch:
      operationId: updateUserName
      description: Set user name for an inbox account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserNameRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /user/agreements:
    get:
      operationId: listUserAgreements
      description: See agreed and outstanding agreements
      responses:
        "200":
          description: Success, agreement list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUserAgreementsResponse"
    patch:
      operationId: setConsentedAgreements
      description: Set agreed agreements for an inbox accoutn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserAgreementsRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetUserAgreementsResponse"
        "400":
          description: Bad request
        "500":
          Description: Internal server error

  /user/agreements/{agreementSlug}:
    operationId: getUserAgreement
    get:
      description: Get agreement
      parameters:
        - in: path
          name: agreementSlug
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAgreement"
        "404":
          description: Not found

  /inbox:
    get:
      operationId: getInboxMetadata
      description: Get information about the inbox
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMetadataResponse"

  /inbox/changeset:
    patch:
      operationId: updateChangeSet
      description: Append leaf for update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSetRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateChangeSetResponse"
        "404":
          description: Not found
        "500":
          description: Internal server error

    get:
      operationId: getChangeset
      description: Get the current paths and operations the user has selected for update
      parameters:
        - in: query
          name: operation
          schema:
            $ref: "#/components/schemas/UpdateOperation"
          required: true
          description: Get changeset for either mark-read or delete
      responses:
        "200":
          description: Success, list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSetResponse"

    delete:
      operationId: clearChangeset
      description: Delete any current selection for the given update operation
      parameters:
        - in: query
          name: operation
          schema:
            $ref: "#/components/schemas/UpdateOperation"
          required: true
          description: Clear changeset for either mark-read or delete
      responses:
        "200":
          description: Success, cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /inbox/changeset/commit:
    post:
      operationId: commitChangeset
      description: Commit pending deletes/mark reads selected for this inbox's folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Success, committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Bad or unconfirmed request
        "500":
          description: Internal server error

  /inbox/classification:
    post:
      operationId: startClassify
      description: Begin classifying inbox messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInboxClassifyRequest"
      responses:
        "202":
          description: Success, processing has been enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Bad request
        "500":
          description: Internal server error

    get:
      operationId: getClassificationLeaf
      description: Get classification leaf by path
      parameters:
        - in: query
          name: path
          schema:
            # comma-separated
            type: string
          required: true
          description: Comma-separated path to leaf node
      responses:
        "200":
          description: Success, classification leaf
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"
        "404":
          description: Inbox or leaf not found
        "500":
          description: Internal server error

  /inbox/classification/summary:
    get:
      operationId: getClassificationSummary
      description: Get the summary tree of inbox classifications
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          required: false
          description: Result page to fetch, defaults to 0 == first page
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"
        "404":
          description: Not found
        "500":
          description: Internal server error

  /inbox/classification/status:
    get:
      operationId: getClassificationStatus
      description: Get the status of the current classification request for this account (if any)
      responses:
        "200":
          description: Classification status response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationStatusResponse"
        "500":
          description: Internal server error

  /plans:
    get:
      description: Get available plans
      operationId: listPlans
      responses:
        "200":
          description: Success, list of plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlansResponse"
        "500":
          description: Internal server errror

  /payment:
    get:
      description: Get payment details
      operationId: getPaymentStatus
      responses:
        "200":
          description: Success - payment details enclosed. Status code does not reflect payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPaymentStatus"
        "500":
          description: Internal server error

    post:
      description: Initiate payment
      operationId: initiatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentRequest"
      responses:
        "200":
          description: Payment initiated, follow redirect link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiatePaymentResponse"
        "500":
          description: Internal server error

  /payment/success:
    get:
      description: Submit payment success details
      operationId: completePayment
      parameters:
        - in: query
          name: checkoutSessionId
          required: true
          schema:
            type: string
          description: Stripe checkout session ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "500":
          description: Internal server error

  # Note:
  # Paths prefixed with /login do not require authentication!
  # /login paths are public

  /login:
    post:
      operationId: initiateLogin
      description: Initiate login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartLoginResponse"
        "401":
          description: Auth failure

  /login/{token}/{signature}:
    get:
      operationId: submitLoginToken
      description: Complete login
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Auth failure
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
        - in: path
          name: signature
          schema:
            type: string
          required: true

  /login/gmail:
    get:
      operationId: submitGmailStateToken
      description: Complete Gmail login
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Auth failure
      parameters:
        - in: query
          name: stateToken
          schema:
            type: string
          required: true
        - in: query
          name: code
          schema:
            type: string
          required: true

  /reauth/gmail:
    get:
      operationId: reauthenticateGmail
      description: reauthenticate Gmail account (requires being logged in to Mailboxsweep)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartLoginResponse"
        "500":
          description: Internal server error

  /logout:
    get:
      operationId: logout
      description: Log out
      responses:
        "200":
          description: Success
        "500":
          description: Internal server error
        "401":
          description: Unauthorized

  /healthcheck:
    get:
      operationId: healthCheck
      description: Health check route
      security: []
      responses:
        "200":
          description: Success
