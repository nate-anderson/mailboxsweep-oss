openapi: 3.0.0
info:
  version: 0.0.1
  title: Mailboxsweep Public API

components:
  schemas:
    Classifier:
      type: object
      required:
        - typeKey
      properties:
        typeKey:
          type: string
          description: the type key of the classifier
        initValue:
          type: string
          description: the optional initializer for thie classifier

    CreateCredentialRequest:
      type: object
      required:
        - address
        - password
      properties:
        address:
          type: string
        password:
          type: string

    CreateCredentialResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
    
    GetCredentialResponse:
      type: object
      required:
        - address
        - created
        - expires
      properties:
        address:
          type: string
        created:
          type: string
        expires:
          type: string

    GetFoldersResponse:
      type: object
      required:
        - address
        - folders
      properties:
        address:
          type: string
        folders:
          type: array
          items:
            type: string
    
    StartInboxClassifyRequest:
      type: object
      required:
        - address
        - folders
        - classifiers
      properties:
        address:
          type: string
        folders:
          type: array
          items:
            type: string
        classifiers:
          type: array
          items:
            $ref: '#/components/schemas/Classifier'
    
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        message:
          type: string

paths:
  /credential:
    post:
      description: Add credentials to access an inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

    get:
      description: Get the currently in-use credential
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCredentialResponse'
        '404':
          description: Not found - probably not created
    
  /inbox/folders:
    get:
      description: List inbox folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFoldersResponse'

  /inbox/classification:
    post:
      description: Begin classifying inbox messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInboxClassifyRequest'
      responses:
        '202':
          description: Success, processing has been enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

    get:
      description: Get the tree of inbox classifications
      responses:
        '200':
          description: Success
        '202':
          description: Classification still pending
        '404':
          description: Not found
        '500':
          description: Internal server error