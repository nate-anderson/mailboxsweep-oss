openapi: 3.0.0
info:
  version: 0.0.1
  title: Mailboxsweep Public API

components:
  schemas:

    Classification:
      type: object
      required:
        - count
        - label
        - dimension
        - children
      properties:
        count:
          type: integer
        label:
          type: string
        dimension:
          type: string
        children:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Classification'

    ClassificationResponse:
      type: object
      required:
        - classification
      properties:
        classification:
          $ref: '#/components/schemas/Classification'

    Classifier:
      type: object
      required:
        - typeKey
      properties:
        typeKey:
          type: string
          description: the type key of the classifier
        initValue:
          type: string
          description: the optional initializer for thie classifier

    CreateCredentialRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string

    CreateCredentialResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
    
    GetCredentialResponse:
      type: object
      required:
        - address
        - created
        - expires
      properties:
        address:
          type: string
        created:
          type: string
        expires:
          type: string

    GetFoldersResponse:
      type: object
      required:
        - address
        - folders
      properties:
        address:
          type: string
        folders:
          type: array
          items:
            type: string
    
    LoginRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    LoginResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string

    MessagePreview:
      type: object
      required:
        - sender
      properties:
        sender:
          $ref: '#/components/schemas/Sender'
        subject:
          type: string

    Sender:
      type: object
      required:
        - address
      properties:
        name:
          type: string
        addres:
          type: string

    StartInboxClassifyRequest:
      type: object
      required:
        - address
        - folders
        - classifiers
      properties:
        address:
          type: string
        folders:
          type: array
          items:
            type: string
        classifiers:
          type: array
          items:
            $ref: '#/components/schemas/Classifier'
    
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        message:
          type: string

paths:
  /credential:
    post:
      description: Add credentials to access an inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

    get:
      description: Get the currently in-use credential
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCredentialResponse'
        '404':
          description: Not found - probably not created

  /inbox/classification:
    post:
      description: Begin classifying inbox messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInboxClassifyRequest'
      responses:
        '202':
          description: Success, processing has been enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error
    
    get:
      description: Get classification leaf by path
      responses:
        '200':
          description: Success, classification leaf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '404':
          description: Inbox or leaf not found
        '500':
          description: Internal server error

  /inbox/classification/summary:
    get:
      description: Get the summary tree of inbox classifications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '202':
          description: Classification still pending
        '404':
          description: Not found
        '500':
          description: Internal server error

  /inbox/folders:
    get:
      description: List inbox folders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFoldersResponse'

  /login:
    post:
      description: Initiate login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Auth failure
  
  /login/{token}:
    get:
      description: Complete login
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Auth failure
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
